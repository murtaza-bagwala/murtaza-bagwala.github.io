<svg width="780" height="320" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'Courier New', monospace"><defs><marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path fill="#555" d="M0 0l10 3.5L0 7z"/></marker></defs><rect width="780" height="320" fill="#fafafa" rx="10" stroke="#e0e0e0"/><text x="195" y="38" text-anchor="middle" font-size="15" font-weight="bold" fill="#222" letter-spacing="1">TRAINING</text><rect x="95" y="55" width="200" height="48" rx="7" fill="#3b82f6"/><text x="195" y="84" text-anchor="middle" font-size="13" fill="#fff" font-weight="600">Historical Data</text><path stroke="#555" stroke-width="2" marker-end="url(#a)" d="M195 103v30"/><rect x="95" y="133" width="200" height="48" rx="7" fill="#f59e0b"/><text x="195" y="162" text-anchor="middle" font-size="13" fill="#fff" font-weight="600">Train Model</text><text x="195" y="178" text-anchor="middle" font-size="10" fill="#fff8" font-style="italic">(adjust weights, minimize loss)</text><path stroke="#555" stroke-width="2" marker-end="url(#a)" d="M195 187v30"/><rect x="95" y="217" width="200" height="48" rx="7" fill="#10b981"/><text x="195" y="246" text-anchor="middle" font-size="13" fill="#fff" font-weight="600">Saved Model Weights</text><text x="195" y="260" text-anchor="middle" font-size="10" fill="#fff8" font-style="italic">(model.pkl, model.pt, etc.)</text><text x="195" y="295" text-anchor="middle" font-size="11" fill="#888" font-style="italic">Happens once (or periodically)</text><path stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="6,4" d="M390 15v290"/><text x="585" y="38" text-anchor="middle" font-size="15" font-weight="bold" fill="#222" letter-spacing="1">INFERENCE</text><rect x="485" y="55" width="200" height="48" rx="7" fill="#3b82f6"/><text x="585" y="84" text-anchor="middle" font-size="13" fill="#fff" font-weight="600">New Input</text><text x="585" y="97" text-anchor="middle" font-size="10" fill="#fff8" font-style="italic">(user request, image, text...)</text><path stroke="#555" stroke-width="2" marker-end="url(#a)" d="M585 103v30"/><rect x="485" y="133" width="200" height="48" rx="7" fill="#10b981"/><text x="585" y="162" text-anchor="middle" font-size="13" fill="#fff" font-weight="600">Load Saved Weights</text><text x="585" y="175" text-anchor="middle" font-size="10" fill="#fff8" font-style="italic">(loaded once, reused)</text><path stroke="#555" stroke-width="2" marker-end="url(#a)" d="M585 181v36"/><rect x="485" y="217" width="200" height="48" rx="7" fill="#8b5cf6"/><text x="585" y="246" text-anchor="middle" font-size="13" fill="#fff" font-weight="600">Prediction</text><text x="585" y="260" text-anchor="middle" font-size="10" fill="#fff8" font-style="italic">(&quot;negative&quot;, 0.91 confidence)</text><text x="585" y="295" text-anchor="middle" font-size="11" fill="#888" font-style="italic">Happens on every user request</text></svg>