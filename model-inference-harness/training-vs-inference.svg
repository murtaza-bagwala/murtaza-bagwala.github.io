<svg width="780" height="320" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'Courier New', monospace">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="780" height="320" fill="#fafafa" rx="10" stroke="#e0e0e0" stroke-width="1"/>

  <!-- === LEFT: TRAINING === -->
  <text x="195" y="38" text-anchor="middle" font-size="15" font-weight="bold" fill="#222" letter-spacing="1">TRAINING</text>

  <!-- Historical Data -->
  <rect x="95" y="55" width="200" height="48" rx="7" fill="#3b82f6"/>
  <text x="195" y="84" text-anchor="middle" font-size="13" fill="white" font-weight="600">Historical Data</text>

  <!-- Arrow -->
  <line x1="195" y1="103" x2="195" y2="133" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Train Model -->
  <rect x="95" y="133" width="200" height="48" rx="7" fill="#f59e0b"/>
  <text x="195" y="162" text-anchor="middle" font-size="13" fill="white" font-weight="600">Train Model</text>
  <text x="195" y="178" text-anchor="middle" font-size="10" fill="#fff8" font-style="italic">(adjust weights, minimize loss)</text>

  <!-- Arrow -->
  <line x1="195" y1="187" x2="195" y2="217" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Saved Weights -->
  <rect x="95" y="217" width="200" height="48" rx="7" fill="#10b981"/>
  <text x="195" y="246" text-anchor="middle" font-size="13" fill="white" font-weight="600">Saved Model Weights</text>
  <text x="195" y="260" text-anchor="middle" font-size="10" fill="#fff8" font-style="italic">(model.pkl, model.pt, etc.)</text>

  <!-- Done label -->
  <text x="195" y="295" text-anchor="middle" font-size="11" fill="#888" font-style="italic">Happens once (or periodically)</text>

  <!-- Divider -->
  <line x1="390" y1="15" x2="390" y2="305" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- === RIGHT: INFERENCE === -->
  <text x="585" y="38" text-anchor="middle" font-size="15" font-weight="bold" fill="#222" letter-spacing="1">INFERENCE</text>

  <!-- New Input -->
  <rect x="485" y="55" width="200" height="48" rx="7" fill="#3b82f6"/>
  <text x="585" y="84" text-anchor="middle" font-size="13" fill="white" font-weight="600">New Input</text>
  <text x="585" y="97" text-anchor="middle" font-size="10" fill="#fff8" font-style="italic">(user request, image, text...)</text>

  <!-- Arrow -->
  <line x1="585" y1="103" x2="585" y2="133" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Load Weights -->
  <rect x="485" y="133" width="200" height="48" rx="7" fill="#10b981"/>
  <text x="585" y="162" text-anchor="middle" font-size="13" fill="white" font-weight="600">Load Saved Weights</text>
  <text x="585" y="175" text-anchor="middle" font-size="10" fill="#fff8" font-style="italic">(loaded once, reused)</text>

  <!-- Arrow -->
  <line x1="585" y1="181" x2="585" y2="217" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Prediction -->
  <rect x="485" y="217" width="200" height="48" rx="7" fill="#8b5cf6"/>
  <text x="585" y="246" text-anchor="middle" font-size="13" fill="white" font-weight="600">Prediction</text>
  <text x="585" y="260" text-anchor="middle" font-size="10" fill="#fff8" font-style="italic">("negative", 0.91 confidence)</text>

  <!-- Done label -->
  <text x="585" y="295" text-anchor="middle" font-size="11" fill="#888" font-style="italic">Happens on every user request</text>
</svg>
